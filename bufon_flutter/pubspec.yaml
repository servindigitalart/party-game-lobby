name: bufon_flutter
description: "BUFÓN - Multiplayer party game MVP"
publish_to: 'none'

version: 1.0.0+3

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Firebase
  firebase_core: ^3.10.0
  firebase_auth: ^5.3.5
  cloud_firestore: ^5.5.4
  cloud_functions: ^5.2.2
  firebase_analytics: ^11.3.4
  firebase_crashlytics: ^4.1.8

  # Reactive streams
  rxdart: ^0.28.0

  # Local storage
  shared_preferences: ^2.3.3

  # Crypto
  crypto: ^3.0.3

  # Monetization
  google_mobile_ads: ^5.2.0
  in_app_purchase: ^3.3.0

  # UI
  cupertino_icons: ^1.0.8
  # google_fonts removed in Fase 2A: it fetched brand typography over HTTP at
  # runtime, so a cold offline launch rendered the whole app in the platform
  # default face. The faces are bundled under assets/fonts/ instead — see
  # AppTypography and docs/design/v1.1/TYPOGRAPHY_AUDIT.md.

  # Sharing
  share_plus: ^10.1.2
  path_provider: ^2.1.5
  talker: ^5.1.20
  package_info_plus: ^9.0.1
  firebase_app_check: ^0.3.2+10

  # External links
  # Opens the public Privacy Policy in the system browser from Home. No
  # WebView, no in-app browser: `LaunchMode.externalApplication` is the whole
  # of what this app asks of the OS.
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0
  fake_cloud_firestore: ^3.1.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  uses-material-design: true

  assets:
    - assets/questions.json
    # Real brand marks (Capítulo 2). Until Fase 2A these lived in /public —
    # the leftover Create React App web root — so the shipped app contained
    # no pixels of its own identity.
    #
    # `wordmark.png` is deliberately NOT bundled (Fase 2B WP6). It shipped in
    # every install for ~96 KB and rendered nowhere, and it cannot be adopted
    # yet: it reads BUFON while every string in the app reads BUFÓN, a naming
    # decision BUFON_V1.1_VISUAL_BLUEPRINT.md §556 reserves for the owner and
    # which blocks its own adoption item (I5). The file stays in the repo as
    # brand source; add the line back when the accent question is answered.
    - assets/brand/isotype.png

  fonts:
    # Bundled, not runtime-fetched. Latin subset (verified to cover every
    # accented character Spanish copy uses) with the three weights the
    # AppTypography scale actually asks for: 400 normal, 600 w600, 700 bold.
    # ~90 KB total. Licence: SIL OFL 1.1, see assets/fonts/OFL.txt.
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
